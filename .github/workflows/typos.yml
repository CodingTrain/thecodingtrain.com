name: Content typos tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check spelling in content directory
        uses: crate-ci/typos@master
        with:
          files: ./content
